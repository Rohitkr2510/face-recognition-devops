[project]
name = "sightline-face-detection"
version = "1.0.0"
description = "Privacy-first face detection dashboard and API"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "numpy>=2.3,<3",
  "opencv-python-headless>=4.12,<5",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
