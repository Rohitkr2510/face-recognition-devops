[project]
name = "sightline-face-detection"
version = "1.0.0"
description = "Privacy-first face detection dashboard and API"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "jinja2==3.1.6",
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "ruff==0.12.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

